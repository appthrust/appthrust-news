name: Publish AppThrust News

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write
  id-token: write

# One writer owns the read/merge/PUT sequence across all AppThrust News tags.
concurrency:
  group: appthrust-news-catalog-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'appthrust/appthrust-news'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.1
      - name: Check the append-only edition
        env:
          TAG: ${{ github.ref_name }}
        run: bun hack/check-edition.ts --exclude-tag "$TAG"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.3
      - name: Select version
        id: release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          [[ "$version" =~ ^1\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]] || {
            echo 'AppThrust News versions must have major 1 (stream "1")' >&2
            exit 1
          }
          test "${#version}" -le 63
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Reuse an already recorded immutable image
        id: recorded
        env:
          VERSION: ${{ steps.release.outputs.version }}
          CLOUD_API_URL: ${{ vars.CLOUD_API_URL || 'https://api.appthrust.com' }}
          CLOUD_CATALOG_ADMIN_TOKEN: ${{ secrets.CLOUD_CATALOG_ADMIN_TOKEN }}
        run: bun hack/publish-entry.ts recorded --version "$VERSION"
      - name: Build and push both architectures
        if: steps.recorded.outputs.digest == ''
        env:
          VERSION: ${{ steps.release.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --tag "ghcr.io/appthrust/appthrust-news:$VERSION" \
            --label "org.opencontainers.image.source=https://github.com/appthrust/appthrust-news" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --secret id=NODE_AUTH_TOKEN,env=NODE_AUTH_TOKEN \
            --metadata-file "$RUNNER_TEMP/appthrust-news-image.json" .
      - name: Resolve and sign the image index
        id: image
        env:
          VERSION: ${{ steps.release.outputs.version }}
          RECORDED_DIGEST: ${{ steps.recorded.outputs.digest }}
        run: |
          digest="$RECORDED_DIGEST"
          if [ -z "$digest" ]; then
            digest="$(oras resolve "ghcr.io/appthrust/appthrust-news:$VERSION")"
            test "$digest" = "$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/appthrust-news-image.json")"
          fi
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          cosign sign --yes "ghcr.io/appthrust/appthrust-news@$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Submit the catalog snapshot
        id: catalog
        env:
          VERSION: ${{ steps.release.outputs.version }}
          DIGEST: ${{ steps.image.outputs.digest }}
          CLOUD_API_URL: ${{ vars.CLOUD_API_URL || 'https://api.appthrust.com' }}
          CLOUD_CATALOG_ADMIN_TOKEN: ${{ secrets.CLOUD_CATALOG_ADMIN_TOKEN }}
        run: bun hack/publish-entry.ts submit --version "$VERSION" --digest "$DIGEST"
      - name: Mint the Cloud workflow dispatch token
        if: steps.catalog.outputs.state == 'snapshot'
        id: cloud-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.APPTHRUST_GITHUB_ACTIONS_APP_ID }}
          private-key: ${{ secrets.APPTHRUST_GITHUB_ACTIONS_APP_PRIVATE_KEY }}
          owner: appthrust
          repositories: cloud
      - name: Dispatch Cloud catalog publication
        if: steps.catalog.outputs.state == 'snapshot'
        env:
          GH_TOKEN: ${{ steps.cloud-token.outputs.token }}
          SNAPSHOT_ID: ${{ steps.catalog.outputs.snapshot_id }}
        run: gh api -X POST repos/appthrust/cloud/dispatches -f event_type=catalog-publish -f "client_payload[snapshot_id]=$SNAPSHOT_ID"
      - name: Observe the signed catalog
        timeout-minutes: 12
        env:
          VERSION: ${{ steps.release.outputs.version }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: bun hack/publish-entry.ts await --version "$VERSION" --digest "$DIGEST"
